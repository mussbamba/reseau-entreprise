<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Saveurs d'Afrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Thème clair assumé (demande : lumineux, pas sombre) */
:root{
  color-scheme:light;
  /* Palette fraîche : vert menthe, bleu ciel, rose corail, fond blanc */
  --bg:#f6f9fc; --surface:#ffffff; --surface-2:#f1f5f9; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#10b981; --brand-ink:#ffffff; --brand-soft:#ecfdf5; --mango:#facc15; --leaf:#10b981; --hibiscus:#fb7185;
  --sky:#38bdf8; --coral:#fb7185;
  --amber:#34d399; --amber-2:#10b981; --amber-ink:#ffffff;
  --ok:#23845a; --ok-soft:#dff4e8; --warn:#9a6200; --warn-soft:#fff1d6; --bad:#c0392b; --bad-soft:#fde6e3; --info:#1f6fa8; --info-soft:#e2f0fb;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px -4px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px -10px rgba(16,24,40,.18);
  --display:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.015em}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}
.wax{height:4px;background:repeating-linear-gradient(90deg,var(--brand) 0 22px,var(--mango) 22px 32px,var(--leaf) 32px 54px,var(--hibiscus) 54px 60px)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,250,243,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.topbar-in{display:flex;align-items:center;gap:10px;padding:10px 16px}
.brand{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:6px}
.brand i{width:10px;height:10px;border-radius:50%;background:conic-gradient(var(--brand) 0 25%,var(--mango) 0 50%,var(--leaf) 0 75%,var(--hibiscus) 0);display:inline-block}
.mode{margin-left:auto;display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.mode button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.back{border:0;background:var(--surface);box-shadow:var(--shadow);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.main{flex:1;padding:4px 16px 112px;display:flex;flex-direction:column;gap:22px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabbar-in{background:rgba(255,255,255,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:24px;box-shadow:0 10px 30px -6px rgba(15,23,42,.25),0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;border-radius:18px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 5px);background:var(--brand);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums;border:2px solid #fff}

/* ---------- Hero 3D ---------- */
.hero{position:relative;border-radius:30px;overflow:hidden;background:
  radial-gradient(120% 80% at 90% 0%,#ffd9b8 0,rgba(255,217,184,0) 60%),
  radial-gradient(90% 70% at 0% 100%,#d9f2e2 0,rgba(217,242,226,0) 60%),
  radial-gradient(70% 60% at 100% 100%,#ffd6e2 0,rgba(255,214,226,0) 60%),
  linear-gradient(180deg,#fff3e4,#fffaf3);
  box-shadow:0 20px 40px -20px rgba(228,87,46,.35)}
.hero-copy{position:relative;z-index:2;padding:22px 20px 0;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.hero h1{font-size:33px;line-height:1.02;font-weight:800}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--hibiscus));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:14.5px;max-width:34ch}
.stage{position:relative;height:270px;margin-top:-4px;touch-action:pan-y}
.stage canvas{display:block;width:100%;height:100%}
.stage .hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.7);padding:4px 10px;border-radius:999px;white-space:nowrap}
.hero-cta{position:relative;z-index:2;display:flex;gap:8px;padding:0 20px 20px;flex-wrap:wrap}
.chip-soft{font-size:12.5px;font-weight:700;background:rgba(255,255,255,.75);border-radius:999px;padding:6px 12px;color:var(--ink)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-h h2{font-size:21px}
.link{border:0;background:none;color:var(--brand);font-weight:700;font-size:14px;padding:0}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:4px 16px 8px}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--ink);color:#fff}

/* ---------- Cartes produit flottantes ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pcard{background:var(--surface);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out}
.pvis{position:relative;aspect-ratio:1/1.02;max-width:100%;border:0;width:100%;padding:0;display:block;background:radial-gradient(90% 80% at 50% 35%,#fff 0,var(--tint) 70%)}
.floaty{position:absolute;inset:8% 10% 16%;display:grid;place-items:center}
.floaty img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(15,23,42,.18))}
.floaty img.photo{object-fit:cover;border-radius:18px;box-shadow:0 14px 24px -10px rgba(15,23,42,.45)}
.floaty .ph{font-size:46px}
.ground{position:absolute;left:50%;bottom:9%;width:48%;height:10px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(15,23,42,.22),rgba(15,23,42,0))}
@media (prefers-reduced-motion:no-preference){
  .floaty{animation:float 5.5s ease-in-out infinite}
  .ground{animation:ground 5.5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(3px) rotate(-1.2deg)}50%{transform:translateY(-9px) rotate(1.2deg)}}
  @keyframes ground{0%,100%{transform:translateX(-50%) scale(1);opacity:1}50%{transform:translateX(-50%) scale(.78);opacity:.65}}
}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.origin{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.pname{font-weight:700;font-size:14px;line-height:1.25;border:0;background:none;padding:0;text-align:left}
.prow{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-weight:800;font-variant-numeric:tabular-nums}
.add{width:38px;height:38px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .15s}
.add:active{transform:scale(.9)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:0 14px}
.search input{border:0;background:transparent;padding:14px 0;flex:1;outline:none;min-width:0}

/* ---------- Composants ---------- */
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-primary{background:linear-gradient(135deg,var(--brand),#f07a3c);color:#fff;box-shadow:0 10px 20px -10px rgba(228,87,46,.7)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-bad{background:var(--bad-soft);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.card{background:var(--surface);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.thumb{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none;overflow:hidden;background:var(--tint,var(--surface-2))}
.thumb img{width:88%;height:88%;object-fit:contain}
.thumb img.photo{width:100%;height:100%;object-fit:cover}
.qty{display:flex;align-items:center;background:var(--surface-2);border-radius:999px}
.qty button{border:0;background:none;width:34px;height:34px;font-size:18px;font-weight:700}
.qty span{min-width:18px;text-align:center;font-variant-numeric:tabular-nums;font-weight:800}
.small{font-size:12.5px;color:var(--muted)}
.line{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.line.total{font-weight:800;font-size:17px;border-top:1px dashed var(--line);padding-top:10px}
.note{border-radius:18px;padding:12px 14px;font-size:13.5px}
.note-brand{background:var(--brand-soft);color:#7a2a10}
.note-warn{background:var(--warn-soft);color:var(--warn)}
.note-ok{background:var(--ok-soft);color:var(--ok)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;font-size:16px;width:100%}
.field input:focus,.field select:focus{border-color:var(--brand);outline:none;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.s-NEW{background:var(--info-soft);color:var(--info)}
.s-SHOPPING{background:var(--warn-soft);color:var(--warn)}
.s-PURCHASED{background:var(--brand-soft);color:var(--brand)}
.s-SHIPPED,.s-DELIVERED{background:var(--ok-soft);color:var(--ok)}
.s-CANCELLED{background:var(--bad-soft);color:var(--bad)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:30px 1fr;gap:12px;position:relative;padding-bottom:16px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.step.done:not(:last-child)::before{background:var(--leaf)}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.step.done .dot{background:var(--leaf);color:#fff}
.step .t{font-weight:700}
.step:not(.done) .t{color:var(--muted)}
.how{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.how div{background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.how b{font-family:var(--display);font-size:15px}
.how span.n{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:13px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.olist{display:flex;flex-direction:column;gap:10px}
.oitem{background:var(--surface);border:0;border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);width:100%}
.store-h{background:linear-gradient(135deg,#fff0e0,#ffe2d4);border-radius:24px 24px 0 0;padding:14px 16px}
.store-h h3{font-size:17px}
.store-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
.store-body{background:var(--surface);border-radius:0 0 24px 24px;box-shadow:var(--shadow)}
.shop-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.shop-item:first-child{border-top:0}
.qbig{width:40px;height:40px;border-radius:50%;background:var(--mango);color:#3a2408;font-weight:800;display:grid;place-items:center;flex:none;font-variant-numeric:tabular-nums}
.sq{width:44px;height:44px;border-radius:14px;border:0;font-size:18px;font-weight:800;flex:none}
.sq-ok{background:var(--ok);color:#fff}
.sq-bad{background:var(--bad-soft);color:var(--bad)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:800}
.seg button[aria-pressed="true"].b{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"].u{background:var(--bad);border-color:var(--bad);color:#fff}
.strike{text-decoration:line-through;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px;font-size:13.5px;width:calc(100% - 32px);max-width:448px;z-index:50;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.toast small{display:block;opacity:.75;margin-top:2px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{transform:translate(-50%,12px);opacity:0}}}
.empty{text-align:center;padding:40px 10px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .big{font-size:52px}
.detail{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:1;max-width:100%;background:radial-gradient(90% 80% at 50% 35%,#fff 0,var(--tint) 75%)}
.detail .stage{height:100%;margin:0}
.detail .floaty{inset:10%}
/* Photos réelles : affichées en entier (jamais coupées), fond flouté de la même photo pour remplir le cadre */
.pbox{position:absolute;inset:0;overflow:hidden;display:block;background:var(--tint,#f7efe4)}
.pbox .pbg{position:absolute;inset:-12%;width:124%;height:124%;max-width:none;object-fit:cover;filter:blur(24px) saturate(1.15);opacity:.6;transform:scale(1.05)}
.pbox .pfit{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.pvis .pbox .pfit{padding:6px}
/* Photo réelle flottante en 3D (cartes) : tirage photo bordé de blanc, incliné, qui se balance */
.pvis{overflow:hidden}
.pvis .pbg-soft{pointer-events:none;position:absolute;inset:-12%;width:124%;height:124%;max-width:none;object-fit:cover;filter:blur(26px) saturate(1.2);opacity:.35}
.floaty .photo3d{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;min-width:0;min-height:0;border:4px solid #fff;border-radius:14px;background:#fff;
  box-shadow:0 22px 30px -14px rgba(15,23,42,.55),0 2px 6px rgba(15,23,42,.15);transform:perspective(650px) rotateY(-14deg) rotateX(7deg)}
.pvis .floaty{perspective:650px;display:flex;align-items:center;justify-content:center;inset:12% 14% 18%}
@media (prefers-reduced-motion:no-preference){
  .floaty .photo3d{animation:sway 7s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:perspective(650px) rotateY(-16deg) rotateX(7deg)}50%{transform:perspective(650px) rotateY(12deg) rotateX(4deg)}}
}
.detail.has-photo{aspect-ratio:auto;background:#f7efe4}
.detail.has-photo .pbox{position:relative;inset:auto;aspect-ratio:var(--ratio,1)}
.detail.has-photo .pfit{max-height:70vh}
.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:12px;text-align:center;padding:6px 16px;font-weight:700}
.toggle{border:0;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800}
.toggle.on{background:var(--ok-soft);color:var(--ok)}
.toggle.off{background:var(--surface-2);color:var(--muted)}
.photo-btn{border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:800;background:var(--brand-soft);color:var(--brand);cursor:pointer;white-space:nowrap}
.photo-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.reset{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;align-self:center}

/* ================= Identité e-commerce claire ================= */
h1,h2,h3{letter-spacing:-.02em;font-weight:800}
.wax{height:3px}
.topbar{background:linear-gradient(180deg,#ffe8d4 0%,#fff4e8 100%);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 1px 0 var(--line)}
.brand{font-size:17px;color:var(--ink);gap:7px;min-width:0;overflow:hidden}
.brand > span{overflow:hidden;text-overflow:ellipsis}
.brand svg{width:26px;height:26px;flex:none}
.topbar-in{min-width:0}
.mode{flex:none}
.mode button{padding:6px 10px;font-size:12.5px}
.brand b{color:var(--brand)}
.mode{background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(242,107,29,.15)}
.mode button[aria-pressed="true"]{background:var(--brand);color:#fff;box-shadow:0 2px 6px rgba(242,107,29,.35)}
.top-search{padding:0 16px 10px;display:flex;flex-direction:column;gap:8px}
.top-search form{display:flex;align-items:stretch;background:#fff;border-radius:14px;box-shadow:0 0 0 2px rgba(242,107,29,.25),0 4px 12px -4px rgba(242,107,29,.25);overflow:hidden}
.top-search input{flex:1;min-width:0;border:0;padding:13px 14px;font-size:16px;outline:none;background:transparent}
.top-search button{border:0;background:linear-gradient(135deg,var(--amber),var(--amber-2));color:var(--amber-ink);padding:0 16px;display:grid;place-items:center}
.deliver{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#7a4a1f;font-weight:600}
.deliver svg{width:15px;height:15px}
.main{padding:14px 16px 112px;gap:20px}
.tabbar-in{background:#fff;box-shadow:0 8px 28px -8px rgba(16,24,40,.22),0 0 0 1px var(--line)}
.back{box-shadow:0 0 0 1px var(--line)}

/* Catégories en pastilles illustrées */
.catrow{display:grid;grid-auto-flow:column;grid-auto-columns:76px;gap:12px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 4px}
.catrow::-webkit-scrollbar{display:none}
.catbub{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:700;text-align:center;line-height:1.2;color:var(--ink)}
.catbub span.ic{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--tint) 80%);display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}
.catbub img{width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.12))}

/* Bannière principale lumineuse */
.hero{background:linear-gradient(135deg,#fff3e2 0%,#ffe4ec 48%,#e2f1ff 100%);box-shadow:var(--shadow-lg);border-radius:24px}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,61,.45),rgba(255,196,61,0) 70%);pointer-events:none}
.hero .eyebrow{display:inline-flex;align-self:flex-start;background:#fff;color:var(--brand);padding:5px 10px;border-radius:999px;letter-spacing:.06em;font-size:11px;box-shadow:var(--shadow)}
.hero h1{font-size:30px;color:var(--ink)}

const STOPW = new Set("de du des la le les l d un une et en au aux pour avec sans sur a je veux il me faut kg g ml svp the of and".split(" "));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
function lev(a,b){ if(Math.abs(a.length-b.length)>2) return 3; const r=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let d=r[0]; r[0]=i; for(let j=1;j<=b.length;j++){ const t=r[j]; r[j]=Math.min(r[j]+1,r[j-1]+1,d+(a[i-1]===b[j-1]?0:1)); d=t; } } return r[b.length]; }
const aliasesOf = p => p.aliases ?? ALIASES[p.id] ?? "";
function scoreP(q,p){
  const text = norm(p.name+" "+aliasesOf(p).replace(/,/g," ")), words = text.split(" "), nq = norm(q), has = (t,ph)=>` ${t} `.includes(` ${ph} `);
  let score = 0; const cov = new Set();
  for(const g of LOCAL_NAMES){ const inQ = g.filter(n=>has(nq,n)); if(inQ.length && g.some(n=>has(text,n))){ score+=6; inQ.forEach(n=>n.split(" ").forEach(w=>cov.add(w))); } }
  const toks = nq.split(" ").filter(t=>t.length>=2&&!STOPW.has(t)&&!/^\d+(kg|g|ml|l|x)?$/.test(t)); let m = 0;
  for(const t of toks){ if(cov.has(t)){ m++; continue; } let b=0;
    for(const w of words){ if(w===t) b=Math.max(b,4); else if(t.length>=3&&(w.startsWith(t)||(t.length>=5&&w.length>=4&&t.startsWith(w)))) b=Math.max(b,3); else if(t.length>=4&&lev(t,w)<=(t.length>=7?2:1)) b=Math.max(b,2); }
    if(!b && t.length>=4 && norm(cat(p.cat).name).split(" ").some(w=>w.startsWith(t))) b=1;
    if(b) m++; score+=b; }
  return {score, exact: toks.length>0 && m===toks.length};
}
function rankP(q,list){
  const sc = list.map(p=>({p,...scoreP(q,p)})).filter(x=>x.score>0).sort((a,b)=>b.exact-a.exact||b.score-a.score);
  const exact = sc.some(x=>x.exact), kept = exact?sc.filter(x=>x.exact):sc.slice(0,8), top = kept[0]?.score||0;
  return {list: kept.filter(x=>x.score>=top/2).map(x=>x.p), exact};
}
const bestP = (q,list) => { const r = rankP(q,list); return r.exact ? r.list[0]||null : null; };

const SPLIT = /[,;\n+]|\s(?:et|and)\s/i;
const NUMW = {un:1,une:1,deux:2,trois:3,quatre:4,cinq:5,six:6,sept:7,huit:8,neuf:9,dix:10};
function localPlan(text){
  const cata = allProducts().filter(p=>p.active), pieces = text.split(SPLIT).map(x=>x.trim()).filter(Boolean);
  const nt = ` ${norm(text)} `; let rec = null, len = 0;
  if(pieces.length<2) for(const r of RECIPES) for(const k of r[1]) if(nt.includes(` ${k} `) && k.length>len){ rec=r; len=k.length; }
  const items = [], missing = [];
  const push = (p,q,note) => { const e = items.find(i=>i.id===p.id); if(e) e.qty=Math.max(e.qty,q); else items.push({id:p.id,qty:Math.min(10,Math.max(1,q)),note}); };
  if(rec){
    const m = text.match(/(\d{1,2})\s*(?:personnes?|pers|invit|convives|people)/i) || text.match(/pour\s+(\d{1,2})\b/i);
    const n = m ? Math.min(50,Math.max(1,+m[1])) : rec[2], f = n/rec[2];
    for(const [q,label,qty,fixed] of rec[3]){ const p = bestP(q,cata); if(p) push(p, fixed?qty:Math.ceil(qty*f), label); else missing.push({name:label,note:"Pas encore au catalogue : nous pouvons le chercher pour vous."}); }
    return {title:`${rec[0]} pour ${n} personne${n>1?"s":""}`, intro:"Les produits africains de la recette sont prêts à ajouter au panier.", ai:false, items, missing, pantry:rec[4]};
  }
  const known = x => LOCAL_NAMES.some(g=>g.some(n=>` ${norm(x)} `.includes(` ${n} `)));
  const good = pieces.length>=2 || pieces.some(x=>bestP(x,cata)||known(x));
  if(good) for(const piece of pieces){
    let n = norm(piece), q = 1; const d = n.match(/\b(\d{1,2})\b/); if(d) q=+d[1]; else { const w=n.split(" ").find(x=>NUMW[x]); if(w) q=NUMW[w]; }
    n = n.replace(/\b\d{1,2}\b/g," ").replace(/\b(il me faut|j ai besoin d[e]?|je veux|je voudrais|svp|merci|aussi|sacs?|paquets?|bouteilles?|boites?|pots?|kilos?|kg|litres?|de la|de l|du|des|de|d|l|un|une|deux|trois|quatre|cinq|six|sept|huit|neuf|dix)\b/g," ").replace(/\s+/g," ").trim();
    if(n.length<2) continue; const p = bestP(n,cata);
    if(p) push(p,q,""); else missing.push({name:piece.replace(/^\s*\d+\s*/,"").slice(0,80),note:"Pas encore au catalogue."});
  }
  return items.length||missing.length
    ? {title:"Votre liste de courses", intro:"Voici ce que j'ai trouvé. Ajustez les quantités puis ajoutez tout au panier.", ai:false, items, missing, pantry:[]}
    : {title:"Je n'ai pas bien compris", intro:"Écrivez un plat (ex. « mafé pour 6 ») ou une liste de produits séparés par des virgules.", ai:false, items, missing, pantry:[]};
}

async function aiPlan(text){

Le client écrit un plat, un repas, une occasion ou une liste de courses, parfois avec des noms locaux (wolof, lingala, yoruba, dioula, anglais…) ou des fautes.
Règles : réponds en français ; "items" utilise UNIQUEMENT des id du CATALOGUE ; quantités en unités du catalogue (1 à 10) adaptées au nombre de personnes (4 par défaut) ; "missing" = produits africains nécessaires mais absents du catalogue ; "pantry" = ingrédients courants que le client achète lui-même, avec quantités ; ne nomme jamais de magasin ni d'épicerie ; pas de prix. Si la demande n'a rien à voir avec la cuisine, listes vides et explique dans "intro".
Réponds avec UNIQUEMENT ce JSON : {"title":"Poulet yassa pour 6 personnes","intro":"…","items":[{"id":7,"qty":1,"note":"pour la marinade"}],"missing":[{"name":"…","note":"…"}],"pantry":["1,5 kg de poulet"]}

CATALOGUE (id | nom | autres noms | catégorie) :
${cata.map(p=>`${p.id} | ${p.name} | ${aliasesOf(p)} | ${cat(p.cat).name}`).join("\n")}

DEMANDE DU CLIENT : ${text}`;
  const out = await SAMPLE.json(prompt, {modelTier:"quick"});
  const ids = new Set(cata.map(p=>p.id)), items = [];
  for(const i of Array.isArray(out?.items)?out.items:[]){ const id=Number(i.id); if(ids.has(id)&&!items.some(x=>x.id===id)) items.push({id, qty:Math.min(10,Math.max(1,Math.round(Number(i.qty))||1)), note:String(i.note||"").slice(0,80)}); }
  return {title:String(out?.title||"Votre panier").slice(0,120), intro:String(out?.intro||"").slice(0,400), ai:true, items,
    missing:(Array.isArray(out?.missing)?out.missing:[]).slice(0,10).map(m=>({name:String(m.name||"").slice(0,80),note:String(m.note||"").slice(0,120)})).filter(m=>m.name),
    pantry:(Array.isArray(out?.pantry)?out.pantry:[]).slice(0,12).map(x=>String(x).slice(0,80))};
}
async function runAssistant(text){
  text = text.trim().slice(0,500);
  if(text.length<3){ S.params = {text, err:"Décrivez un plat ou une liste de produits."}; render(); return; }
  S.params = {text, busy:true}; ASST_RUNNING = true; render();
  let plan = null, note = "";
  if(SAMPLE){ try{ plan = await aiPlan(text); } catch(e){ note = e?.code==="not_granted" ? "IA non autorisée : suggestion basée sur nos recettes." : "IA indisponible pour le moment : suggestion basée sur nos recettes."; } }
  if(!plan) plan = localPlan(text);
  ASST_RUNNING = false;
  if(S.view!=="assistant") return;
  S.params = {text, plan, note, qty:Object.fromEntries(plan.items.map(i=>[i.id,i.qty]))}; save(); render();
}

const T = window.THREE;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

function isLight(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255)) > 160; }
function wrapText(g, text, x, y, maxW, lh){
  const words = text.split(" "); let line = "", lines = [];
  for(const w of words){ const t = line ? line+" "+w : w; if(g.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  lines.push(line); const y0 = y - (lines.length-1)*lh/2; lines.forEach((l,i)=>g.fillText(l,x,y0+i*lh));
}
function waxBand(g, x, y, w, h, cols){ const step = h*1.4; for(let i=0;x+i*step<x+w;i++){ g.fillStyle = cols[i%cols.length]; g.fillRect(x+i*step,y,step*.6,h); g.fillStyle = cols[(i+2)%cols.length]; g.fillRect(x+i*step+step*.6,y,step*.4,h);} }
// Étiquette dessinée sur un canvas puis plaquée sur l'emballage
function labelTexture(p, W, H, bg, panel){
  const c = document.createElement("canvas"); c.width = W; c.height = H; const g = c.getContext("2d");
  g.fillStyle = bg; g.fillRect(0,0,W,H);
  const px = panel ? W*.1 : 0, py = panel ? H*.2 : 0, pw = panel ? W*.8 : W, ph = panel ? H*.62 : H;
  const col = panel || p.v.label;
  g.fillStyle = col; if(panel){ g.beginPath(); g.roundRect ? g.roundRect(px,py,pw,ph,W*.06) : g.rect(px,py,pw,ph); g.fill(); } else g.fillRect(0,0,W,H);
  const band = Math.max(10,H*.06);
  waxBand(g, px, py, pw, band, ["#34d399","#38bdf8","#fb7185","#facc15"]);
  waxBand(g, px, py+ph-band, pw, band, ["#38bdf8","#fb7185","#facc15","#34d399"]);
  const ink = isLight(col) ? "#2b1e16" : "#ffffff";
  g.fillStyle = ink; g.textAlign = "center"; g.textBaseline = "middle";
  const u = Math.min(pw, ph*1.3);
  g.globalAlpha = .75; g.font = `700 ${u*.055}px "Plus Jakarta Sans", sans-serif`; g.fillText("SAVEURS D'AFRIQUE", px+pw/2, py+band+ph*.1); g.globalAlpha = 1;
  g.font = `800 ${u*.14}px "Plus Jakarta Sans", sans-serif`; wrapText(g, p.short, px+pw/2, py+ph*.48, pw*.86, u*.145);

}
function std(color, o={}){ return new T.MeshStandardMaterial({color:new T.Color(color).convertSRGBToLinear(), roughness:o.r??.6, metalness:o.m??0}); }
function phys(color, o={}){ return new T.MeshPhysicalMaterial({color:new T.Color(color).convertSRGBToLinear(), roughness:o.r??.25, metalness:0, clearcoat:o.cc??1, clearcoatRoughness:.15, transparent:o.opacity<1, opacity:o.opacity??1}); }
function pillow(geo, w, h, depthK, pinch){
  const pos = geo.attributes.position;
  for(let i=0;i<pos.count;i++){
    let x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
    const nx=x/(w/2), ny=y/(h/2);
    z *= (1-depthK*nx*nx)*(1-.7*Math.pow(Math.abs(ny),5));
    if(pinch && ny>.72) x *= 1-(ny-.72)*pinch;
    pos.setXYZ(i,x,y,z);
  }

}
function labelBand(r, h, y, tex, arc=Math.PI*1.05){
  const m = new T.Mesh(new T.CylinderGeometry(r, r, h, 64, 1, true, -arc/2, arc), new T.MeshStandardMaterial({map:tex, roughness:.55}));
  m.position.y = y; return m;
}
function buildModel(p){
  const v = p.v, grp = new T.Group();

    const w=1.4,h=1.9,d=.72, geo = new T.BoxGeometry(w,h,d,24,24,8); pillow(geo,w,h,.5,.5);
    const body = std(v.body,{r:.85}), front = new T.MeshStandardMaterial({map:labelTexture(p,512,696,v.body,v.label), roughness:.8});
    grp.add(new T.Mesh(geo,[body,body,body,body,front,body]));
    const tie = new T.Mesh(new T.TorusGeometry(.18,.045,12,32), std(v.accent,{r:.5})); tie.position.set(0,h/2-.08,0); tie.rotation.x = Math.PI/2; grp.add(tie);
    const neck = new T.Mesh(new T.CylinderGeometry(.13,.34,.2,32), std(v.body,{r:.85})); neck.position.y = h/2-.02; grp.add(neck);
    const flare = new T.Mesh(new T.CylinderGeometry(.3,.12,.22,32,1,true), std(v.body,{r:.85})); flare.material.side = T.DoubleSide; flare.position.y = h/2+.17; grp.add(flare);
  } else if(v.shape==="jar"){
    const r = v.wide ? .85 : .66, h = v.wide ? .75 : 1.15;
    grp.add(new T.Mesh(new T.CylinderGeometry(r,r,h,64), phys(v.content,{r:.35,cc:.8})));
    const lid = new T.Mesh(new T.CylinderGeometry(r*1.04,r*1.04,h*.26,64), phys(v.lid,{r:.3,cc:1})); lid.position.y = h/2+h*.12; grp.add(lid);
    const rim = new T.Mesh(new T.TorusGeometry(r*1.04,.025,8,64), phys(v.lid,{r:.3})); rim.rotation.x = Math.PI/2; rim.position.y = h/2+h*.25; grp.add(rim);
    const lh = h*.62, arc = Math.PI*1.05;
    grp.add(labelBand(r*1.008, lh, -h*.06, labelTexture(p, Math.round(512*(r*arc)/lh), 512, v.label, null), arc));
  } else if(v.shape==="bottle"){
    const s = v.small ? .85 : 1;
    const pts = [[0,0],[.42,0],[.46,.05],[.46,1.1],[.43,1.28],[.24,1.58],[.17,1.78],[.17,1.98]].map(([x,y])=>new T.Vector2(x*s,y*s));
    const b = new T.Mesh(new T.LatheGeometry(pts,64), phys(v.content,{r:.12,cc:1,opacity:.96})); b.position.y = -.95*s; grp.add(b);
    const cap = new T.Mesh(new T.CylinderGeometry(.19*s,.19*s,.24*s,48), phys(v.cap,{r:.35})); cap.position.y = (1.98+.1)*s-.95*s; grp.add(cap);
    const lh = .62*s, arc = Math.PI*1.1;
    grp.add(labelBand(.462*s, lh, (.55*s)-.95*s, labelTexture(p, Math.round(512*(.46*s*arc)/lh), 512, v.label, null), arc));
  } else if(v.shape==="box"){
    const body = std(v.body,{r:.45}), front = new T.MeshStandardMaterial({map:labelTexture(p,512,512,v.body,v.label), roughness:.45});
    const top = new T.MeshStandardMaterial({map:labelTexture(p,512,512,v.label,null), roughness:.45});
    grp.add(new T.Mesh(new T.BoxGeometry(1.25,1.25,1.25),[body,body,top,body,front,body]));
  } else if(v.shape==="pouch"){
    const w=1.3,h=1.8, geo = new T.BoxGeometry(w,h,.42,24,24,6); pillow(geo,w,h,.75,0);
    const body = std(v.body,{r:.35}), front = new T.MeshStandardMaterial({map:labelTexture(p,512,708,v.body,v.label), roughness:.35});
    grp.add(new T.Mesh(geo,[body,body,body,body,front,body]));
    const seal = new T.Mesh(new T.BoxGeometry(w*.98,.12,.05), std(v.body,{r:.3})); seal.position.y = h/2-.02; grp.add(seal);
  } else if(v.shape==="soap"){
    const geo = new T.BoxGeometry(1.5,.62,1.05,12,6,10); const pos = geo.attributes.position; const k = new T.Vector3();
    for(let i=0;i<pos.count;i++){ k.fromBufferAttribute(pos,i); const q = k.clone().multiply(new T.Vector3(1/.75,1/.31,1/.525)); const f = Math.pow(Math.abs(q.x),6)+Math.pow(Math.abs(q.y),6)+Math.pow(Math.abs(q.z),6); k.multiplyScalar(1/Math.pow(f,1/6)); pos.setXYZ(i,k.x,k.y,k.z); }
    geo.computeVertexNormals(); grp.add(new T.Mesh(geo, std(v.body,{r:.55})));

    const band = new T.Mesh(new T.BoxGeometry(.78,.66,1.09), [std(v.label),std(v.label),new T.MeshStandardMaterial({map:bandTex,roughness:.8}),std(v.label),std(v.label),std(v.label)]); grp.add(band);

}
// Photo du vendeur transformée en tirage photo 3D (bord blanc, épaisseur, dos crème)
function buildPhotoModel(img){
  const r = img.naturalWidth/img.naturalHeight || 1;
  const H = r>=1 ? 2.1/r : 2.1, W = H*r, pad = .07, d = .06;
  const tex = new T.Texture(img); tex.encoding = T.sRGBEncoding; tex.anisotropy = 8; tex.needsUpdate = true;
  const white = std("#ffffff",{r:.5}), back = std("#f6ecdf",{r:.8});
  const grp = new T.Group();
  grp.add(new T.Mesh(new T.BoxGeometry(W+pad*2,H+pad*2,d),[white,white,white,white,white,back]));
  const face = new T.Mesh(new T.PlaneGeometry(W,H), new T.MeshBasicMaterial({map:tex,toneMapped:false}));
  face.position.z = d/2+.002; grp.add(face);
  const pivot = new T.Group(); pivot.add(grp); pivot.userData.sway = true; pivot.userData.dragY = 0; return pivot;
}
function lights(scene){
  scene.add(new T.HemisphereLight(0xffffff, 0xe6f0f5, .95));
  const key = new T.DirectionalLight(0xffffff, 1.35); key.position.set(3,5,5); scene.add(key);
  const fill = new T.DirectionalLight(0xffe0c2, .55); fill.position.set(-5,2,3); scene.add(fill);
  const rim = new T.DirectionalLight(0xffffff, .8); rim.position.set(0,3,-6); scene.add(rim);
}
function makeRenderer(canvas){
  const opts = {antialias:true, alpha:true, preserveDrawingBuffer:!canvas}; if(canvas) opts.canvas = canvas;
  const r = new T.WebGLRenderer(opts);
  r.outputEncoding = T.sRGBEncoding; r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.08;

}
function disposeTree(o){ o.traverse(n=>{ if(n.geometry) n.geometry.dispose(); const m = n.material; (Array.isArray(m)?m:m?[m]:[]).forEach(mm=>{ if(mm.map) mm.map.dispose(); mm.dispose(); }); }); }

// Rendu "photo studio" de chaque produit, fait une fois puis réutilisé dans les cartes
function snapshot(p){
  if(SNAP[p.id]) return SNAP[p.id];
  if(!snapRenderer){ snapRenderer = makeRenderer(null); snapRenderer.setPixelRatio(1); snapRenderer.setSize(420,420,false); }
  const scene = new T.Scene(); lights(scene);
  const m = buildModel(p); m.rotation.set(.1,-.5,0); if(p.v.shape==="soap") m.rotation.set(.45,-.6,0); scene.add(m);
  const cam = new T.PerspectiveCamera(28,1,.1,50); cam.position.set(0,.45,4.5); cam.lookAt(0,0,0);
  snapRenderer.render(scene,cam); const url = snapRenderer.domElement.toDataURL("image/png");
  disposeTree(scene); SNAP[p.id] = url; return url;
}
function fillSnaps(){
  if(!GL_OK) return;
  const imgs = [...document.querySelectorAll("img[data-snap]:not([src])")];
  let i = 0;
  const step = () => {
    const t0 = performance.now();
    while(i<imgs.length && performance.now()-t0 < 24){ const im = imgs[i++]; if(!im.isConnected) continue; try { im.src = snapshot(prod(+im.dataset.snap)); } catch(e){ GL_OK=false; console.warn(e); return; } }
    if(i<imgs.length) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Scène vivante (accueil et fiche produit) : flottaison + rotation au doigt
let live = null;
function mountStage(el, ids, detail, photoImg){
  if(!GL_OK) return;
  let renderer;
  try { renderer = makeRenderer(el.querySelector("canvas")); } catch(e){ GL_OK=false; return; }
  renderer.setPixelRatio(Math.min(2, devicePixelRatio||1));
  const scene = new T.Scene(); lights(scene);
  const cam = new T.PerspectiveCamera(detail?30:34, 1, .1, 60);
  const objs = photoImg ? [buildPhotoModel(photoImg)] : ids.map((id,i)=>{ const m = buildModel(prod(id)); scene.add(m); return m; });
  if(photoImg) scene.add(objs[0]);
  if(detail){ cam.position.set(0,.5,5.6); if(!photoImg) objs[0].rotation.y = -.5; }
  else {
    const layout = [[-2.05,.2,-.7,.9],[-1.0,-.12,.45,1],[.05,.18,-.35,.92],[1.05,-.12,.5,.98],[2.05,.2,-.75,.85]];
    objs.forEach((m,i)=>{ const [x,y,z,s]=layout[i]; m.position.set(x,y,z); m.scale.setScalar(s); m.userData.base=[x,y,z]; m.rotation.y = -.6+i*.3; });
    cam.position.set(0,.4,6.4);
  }
  cam.lookAt(0,0,0);
  // ombres douces au sol
  const shadowTex = (()=>{ const c=document.createElement("canvas"); c.width=c.height=128; const g=c.getContext("2d"); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,"rgba(15,23,42,.28)"); gr.addColorStop(1,"rgba(15,23,42,0)"); g.fillStyle=gr; g.fillRect(0,0,128,128); return new T.CanvasTexture(c); })();
  const shadows = objs.map(m=>{ const s = new T.Mesh(new T.PlaneGeometry(1.8,.7), new T.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false})); s.rotation.x = -Math.PI/2; scene.add(s); return s; });
  let drag = null, spin = 0, px = 0, py = 0;
  const canvas = renderer.domElement;
  const onDown = e => { drag = {x:e.clientX, y:e.clientY, t:performance.now()}; };
  const onMove = e => { const r = canvas.getBoundingClientRect(); px = ((e.clientX-r.left)/r.width-.5); py = ((e.clientY-r.top)/r.height-.5);
    if(drag){ const dx = e.clientX-drag.x; spin = dx*.012; drag.x = e.clientX;
      objs.forEach(m=>{ if(m.userData.sway) m.userData.dragY = Math.max(-1.3, Math.min(1.3, m.userData.dragY + spin)); else m.rotation.y += spin; }); } };
  const onUp = () => { drag = null; };

  const resize = () => { const w = el.clientWidth, h = el.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); cam.aspect = w/h;

    const t = (now-t0)/1000;

        m.rotation.y = m.userData.dragY + (REDUCED ? 0 : Math.sin(t*.7)*.38); m.rotation.x = REDUCED ? 0 : Math.sin(t*.5)*.06 - .05;
      }

      m.rotation.z = REDUCED ? 0 : Math.sin(t*.8+i)*.05;
      const s = shadows[i]; s.position.set(b[0], (detail?-1.05:-1.1)+b[1]*.2, b[2]); const k = 1-bob*1.2; s.scale.set(k*m.scale.x,k*m.scale.x,1); s.material.opacity = .9-bob*1.5;
    });
    cam.position.x += ((detail?0:px*.9) - cam.position.x)*.05; cam.position.y += ((.45-py*.5) - cam.position.y)*.05; cam.lookAt(0,0,0);

}
function unmountStage(){ if(live){ live.dispose(); live = null; } }

async function hashPw(email, pw){
  const data = new TextEncoder().encode(`saveurs:${email}:${pw}`);
  try { const h = await crypto.subtle.digest("SHA-256", data); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch { let h = 0; for(const b of data) h = (h*31 + b) >>> 0; return "x"+h.toString(16); }
}

function me(){ return S.users.find(x=>S.user && x.email===S.user.email) || {name:S.user?.name||"",email:S.user?.email||""}; }
async function submitProfile(form){
  const d = Object.fromEntries(new FormData(form)), u = me(), msg = {};
  const done = (key, ok, text, keep) => { msg[key] = {ok, text}; S.params = {msg, ...(keep||{})}; save(); render(); };
  if(form.id==="pf-info"){
    const postal = String(d.postal||"").toUpperCase().replace(/\s/g,"");
    if(String(d.name||"").trim().length<2) return done("info", false, "Indiquez votre nom.", {draft:d});
    if(postal && !/^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(postal)) return done("info", false, "Code postal invalide (ex. H2X 1Y4).", {draft:d});
    Object.assign(u, {name:String(d.name).trim(), phone:String(d.phone||"").trim(), address1:String(d.address1||"").trim(), city:String(d.city||"").trim(),
      postal: postal ? postal.slice(0,3)+" "+postal.slice(3) : "", province:d.province});
    S.user.name = u.name;
    return done("info", true, "Vos informations ont été enregistrées.");
  }
  if(form.id==="pf-email"){
    const email = String(d.email||"").trim().toLowerCase(), keep = {newEmail:email};
    if(!/^\S+@\S+\.\S+$/.test(email)) return done("email", false, "Indiquez une adresse courriel valide.", keep);
    if(await hashPw(u.email, String(d.password||"")) !== u.hash) return done("email", false, "Mot de passe incorrect.", keep);
    if(email===u.email) return done("email", false, "C'est déjà votre adresse courriel.", keep);
    if(S.users.some(x=>x.email===email)) return done("email", false, "Cette adresse est déjà utilisée par un autre compte.", keep);
    const old = u.email;
    u.hash = await hashPw(email, String(d.password)); u.email = email; S.user.email = email;
    // les commandes et demandes suivent le compte
    S.orders.forEach(o=>{ if(o.owner===old) o.owner=email; }); S.requests.forEach(r=>{ if(r.owner===old) r.owner=email; });
    return done("email", true, `Votre courriel est maintenant ${email}.`);
  }
  if(form.id==="pf-pass"){
    if(await hashPw(u.email, String(d.current||"")) !== u.hash) return done("pass", false, "Mot de passe actuel incorrect.");
    if(String(d.next||"").length<8) return done("pass", false, "Le nouveau mot de passe doit contenir au moins 8 caractères.");
    if(d.next!==d.confirm) return done("pass", false, "Les deux nouveaux mots de passe ne correspondent pas.");
    u.hash = await hashPw(u.email, String(d.next));
    return done("pass", true, "Votre mot de passe a été changé.");
  }
  if(form.id==="pf-del"){
    if(!d.confirm) return done("del", false, "Cochez la case pour confirmer.");
    if(await hashPw(u.email, String(d.password||"")) !== u.hash) return done("del", false, "Mot de passe incorrect.");
    S.users = S.users.filter(x=>x.email!==u.email); S.user = null; history_.length = 0; save(); go("home",{},false);
    toast("Votre compte a été supprimé","Merci d'avoir magasiné avec nous.","👋");
  }
}
async function submitAuth(form){
  const d = Object.fromEntries(new FormData(form)), kind = form.dataset.kind, err = document.getElementById("authErr");
  const email = String(d.email||"").trim().toLowerCase();
  const fail = m => { err.textContent = m; err.hidden = false; S.params.draft = {name:d.name||"", email}; };
  if(!/^\S+@\S+\.\S+$/.test(email)) return fail("Indiquez une adresse courriel valide.");
  const hash = await hashPw(email, String(d.password||""));
  if(kind==="login"){
    const u = S.users.find(x=>x.email===email);
    if(!u || u.hash!==hash) return fail("Courriel ou mot de passe incorrect.");
    if(u.disabled) return fail("Ce compte est désactivé. Écrivez-nous pour le réactiver.");
    S.user = {name:u.name, email:u.email};
  } else {
    if(String(d.name||"").trim().length<2) return fail("Indiquez votre nom.");
    if(String(d.password||"").length<8) return fail("Le mot de passe doit contenir au moins 8 caractères.");
    if(d.password!==d.confirm) return fail("Les deux mots de passe ne correspondent pas.");
    if(S.users.some(x=>x.email===email)) return fail("Un compte existe déjà avec ce courriel. Identifiez-vous.");
    const postal = String(d.postal||"").toUpperCase().replace(/\s/g,"");
    if(String(d.address1||"").trim().length<3) return fail("Indiquez votre adresse de livraison.");
    if(String(d.city||"").trim().length<2) return fail("Indiquez votre ville.");
    if(!/^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(postal)) return fail("Code postal invalide (ex. H2X 1Y4).");
    // L'adresse saisie à l'inscription devient l'adresse de livraison du profil
    S.users.push({name:String(d.name).trim(), email, hash, createdAt:Date.now(), phone:String(d.phone||"").trim(),
      address1:String(d.address1).trim(), city:String(d.city).trim(), postal:postal.slice(0,3)+" "+postal.slice(3), province:d.province||"QC"});
    S.user = {name:String(d.name).trim(), email};
  }
  const next = S.afterLogin || "account"; S.afterLogin = null;
  history_.length = 0; save(); go(next,{},false);
  toast(`Bonjour, ${S.user.name.split(" ")[0]} !`, kind==="login"?"Vous êtes connecté.":"Votre compte est créé.", "👋");
}

        ${note("info")}

        <h2 style="color:#c40000">Supprimer mon compte</h2>

      </form>`;
  },
  orders(){
    const mine = S.orders.filter(isMine).sort((a,b)=>b.createdAt-a.createdAt);
    const myReqs = S.requests.filter(isMine);
    const reqBlock = myReqs.length?`<button class="oitem" data-a="go" data-v="requests"><div class="line"><b>Mes demandes spéciales</b>${myReqs.some(r=>r.status==="QUOTED")?`<span class="pill s-PURCHASED">Prix reçu</span>`:`<span class="small">${myReqs.length}</span>`}</div><span class="small">Produits que vous nous avez demandé de trouver</span></button>`:"";
    if(!mine.length) return reqBlock +  `<div class="empty"><span class="big">📦</span><h2>Aucune commande</h2><span>Passez une commande pour la voir ici, puis traitez-la dans l'espace Vendeur.</span><button class="btn btn-primary" style="width:auto" data-a="tab" data-v="shop">Commencer mes achats</button></div>`;
    return `${reqBlock}<h1 style="font-size:28px">Mes commandes</h1><div class="olist">${mine.map(o=>`
      <button class="oitem" data-a="order" data-id="${o.id}">
        <div class="line"><b>${num(o.id)}</b>${pill(o.status)}</div>
        <span class="small">${o.items.reduce((s,i)=>s+i.qty,0)} article(s) · ${money(o.final??o.total)}</span>
      </button>`).join("")}</div>`;
  },
  order({id}){
    const o = S.orders.find(x=>x.id===id); if(!o) return VIEWS.orders();
    const idx = STEPS.findIndex(s=>s[0]===o.status);
    return `
      ${S.params.fresh?`<div class="note note-ok"><b>Merci ${esc(o.customer.name.split(" ")[0])} !</b> Commande confirmée. Un courriel a été envoyé à ${esc(o.customer.email)}.</div>`:""}
      <div class="line"><h1 style="font-size:26px">${num(o.id)}</h1>${pill(o.status)}</div>
      ${o.status==="CANCELLED"?`<div class="note note-warn">Commande annulée. Aucun montant n'a été débité.</div>`:`
      <div class="card"><div class="steps">${STEPS.map(([s,l,h],i)=>`
        <div class="step ${i<=idx?"done":""}"><span class="dot">${i<=idx?"✓":i+1}</span><div><div class="t">${l}</div>${i===idx?`<div class="small">${h}</div>`:""}</div></div>`).join("")}
      </div></div>`}
      ${o.tracking?`<div class="card"><b>Suivi du colis</b><span>${esc(o.carrier)} · <b>${esc(o.tracking)}</b></span></div>`:""}
      <div class="card">
        ${o.items.map(i=>{ const p = itemFor(i.pid); return `<div class="row">${p?thumb(p):""}<div class="grow"><div class="${i.status==="UNAVAILABLE"?"strike":""}" style="font-weight:600">${i.qty} × ${esc(i.name)}</div>${i.status==="UNAVAILABLE"?`<div class="small" style="color:var(--bad)">Introuvable, non facturé</div>`:""}</div><span>${money(i.qty*i.price)}</span></div>`; }).join("")}
        <div class="line"><span>Livraison</span><span>${o.shipping?money(o.shipping):"Gratuite"}</span></div>
        <div class="line ${o.final==null?"total":""}"><span>Montant autorisé</span><span>${money(o.total)}</span></div>
        ${o.final!=null?`<div class="line total"><span>Montant débité</span><span>${money(o.final)}</span></div>`:""}
      </div>
      ${o.mine&&["NEW","SHOPPING"].includes(o.status)?`<div class="note note-brand">Astuce démo : touchez <b>Vendeur</b> en haut pour acheter et expédier cette commande, puis revenez ici.</div>`:""}`;
  },

  request(){
    const c = S.user ? {name:S.user.name,email:S.user.email} : (S.lastCustomer || {name:"",email:""}); const d = S.params.draft || {};
    return `
      <div style="display:flex;flex-direction:column;gap:6px">
        <span class="eyebrow">Demande spéciale</span>
        <h1 style="font-size:28px">Vous ne trouvez pas un produit ?</h1>
        <p style="margin:0;color:var(--muted)">Dites-nous ce que vous cherchez. Nous vérifions dans nos épiceries partenaires et vous envoyons un prix. Vous décidez ensuite si vous l'ajoutez à votre panier.</p>
      </div>
      <form id="reqForm" class="card" novalidate>
        <div class="field"><label for="r-name">Produit recherché</label><input id="r-name" name="name" value="${esc(d.name||S.params.prefill||"")}" placeholder="Ex. : feuilles de manioc séchées" required></div>
        <div class="field"><label for="r-details">Détails (marque, format, pays…)</label><input id="r-details" name="details" value="${esc(d.details||"")}" placeholder="Ex. : sachet de 500 g, marque Tropiway"></div>
        <div class="two">
          <div class="field"><label for="r-qty">Quantité</label><input id="r-qty" name="qty" type="number" min="1" max="50" value="${esc(d.qty||1)}"></div>
          <div class="field"><label for="r-max">Prix max / unité ($)</label><input id="r-max" name="max" inputmode="decimal" placeholder="Facultatif" value="${esc(d.max||"")}"></div>
        </div>
        <div class="field"><label>Photo du produit (facultatif)</label>
          <div class="row">
            ${S.params.reqPhoto?`<div class="thumb"><img class="photo" src="${S.params.reqPhoto}" alt="Photo jointe"></div>`:""}
            <label class="photo-btn">${S.params.reqPhoto?"Changer la photo":"Joindre une photo"}<input type="file" accept="image/*" data-reqphoto="1"></label>
          </div>
        </div>
        <div class="two">
          <div class="field"><label for="r-cname">Votre nom</label><input id="r-cname" name="cname" autocomplete="name" value="${esc(d.cname||c.name||"")}"></div>
          <div class="field"><label for="r-email">Courriel</label><input id="r-email" name="email" type="email" autocomplete="email" value="${esc(d.email||c.email||"")}"></div>
        </div>
        <p id="reqErr" class="note note-warn" hidden></p>
        <button class="btn btn-primary" data-a="sendreq">Envoyer ma demande</button>
        <span class="small" style="text-align:center">Gratuit et sans engagement. Réponse habituelle en 24 à 48 h.</span>
      </form>`;
  },
  requests(){
    const mine = S.requests.filter(isMine).sort((a,b)=>b.createdAt-a.createdAt);
    return `<div class="line"><h1 style="font-size:28px">Mes demandes</h1><button class="link" data-a="newreq">+ Nouvelle</button></div>
      ${mine.length?`<div class="olist">${mine.map(r=>`
        <div class="card">
          <div class="row">${thumb({special:true,req:r})}<div class="grow"><div style="font-weight:700">${r.qty} × ${esc(r.name)}</div>${r.details?`<div class="small">${esc(r.details)}</div>`:""}</div>${reqPill(r)}</div>
          ${r.status==="PENDING"?`<span class="small">Nous cherchons ce produit en boutique. Vous recevrez un courriel avec le prix.</span>`:""}
          ${r.status==="QUOTED"?`<div class="note note-brand"><b>Prix trouvé : ${money(r.quote.price)} / unité</b>, soit ${money(r.quote.price*r.qty)} pour ${r.qty}.${r.quote.note?`<br>${esc(r.quote.note)}`:""}</div>
            <div class="two"><button class="btn btn-ghost" data-a="declinereq" data-id="${r.id}">Non merci</button><button class="btn btn-primary" data-a="acceptreq" data-id="${r.id}">Ajouter au panier</button></div>`:""}
          ${r.status==="ACCEPTED"?`<button class="btn btn-ghost" data-a="tab" data-v="cart">Voir le panier</button>`:""}
          ${r.status==="UNAVAILABLE"?`<span class="small">Désolé, introuvable pour le moment.${r.quote&&r.quote.note?` ${esc(r.quote.note)}`:""}</span>`:""}
        </div>`).join("")}</div>`:`<div class="empty"><span class="big">✨</span>Aucune demande pour l'instant.<button class="btn btn-primary" style="width:auto" data-a="newreq">Faire une demande</button></div>`}`;
  },

  // ---------- Espace vendeur ----------
  "a-orders"({tab="todo"}){
    const handle = ["NEW","SHOPPING","PURCHASED"];
    const filters = {todo:["À traiter",o=>handle.includes(o.status)],SHIPPED:["Expédiées",o=>o.status==="SHIPPED"],DELIVERED:["Livrées",o=>o.status==="DELIVERED"],CANCELLED:["Annulées",o=>o.status==="CANCELLED"]};
    const list = S.orders.filter(filters[tab][1]).sort((a,b)=>a.createdAt-b.createdAt);
    const month = S.orders.reduce((s,o)=>s+(o.final??0),0);
    return `
      <div class="stat-row">
        <div class="stat"><b>${S.orders.filter(o=>["NEW","SHOPPING"].includes(o.status)).length}</b><span>À acheter</span></div>
        <div class="stat"><b>${S.orders.filter(o=>o.status==="PURCHASED").length}</b><span>À expédier</span></div>
        <div class="stat"><b style="font-size:17px;line-height:1.75">${money(month)}</b><span>Encaissé</span></div>
      </div>
      <div class="cats">${Object.entries(filters).map(([k,[l,f]])=>`<button class="cat" data-a="otab" data-v="${k}" aria-pressed="${k===tab}">${l} (${S.orders.filter(f).length})</button>`).join("")}</div>
      ${list.length?`<div class="olist">${list.map(o=>`
        <button class="oitem" data-a="aorder" data-id="${o.id}">
          <div class="line"><b>${num(o.id)}</b>${pill(o.status)}</div>
          <span>${esc(o.customer.name)} · ${esc(o.customer.city)}, ${o.customer.province}</span>
          <span class="small">${o.items.reduce((s,i)=>s+i.qty,0)} article(s) · ${money(o.final??o.total)} · ${new Date(o.createdAt).toLocaleString("fr-CA",{dateStyle:"short",timeStyle:"short"})}</span>
        </button>`).join("")}</div>`:`<div class="empty"><span class="big">✅</span>Rien ici.</div>`}
      <button class="reset" data-a="reset">Réinitialiser la démo</button>`;
  },
  "a-order"({id}){
    const o = S.orders.find(x=>x.id===id); if(!o) return VIEWS["a-orders"]({});
    const editable = ["NEW","SHOPPING"].includes(o.status);
    const pending = o.items.filter(i=>i.status==="PENDING").length;
    const bought = o.items.filter(i=>i.status==="BOUGHT");
    const fin = Math.min(totals(bought,o.customer.province,o.shipping).total,o.total);
    const cost = bought.reduce((s,i)=>s+i.cost*i.qty,0);
    return `
      <div class="line"><h1 style="font-size:26px">${num(o.id)}</h1>${pill(o.status)}</div>
      <span class="small">Paiement : ${esc(o.payment)}${o.example?" · commande d'exemple":""}</span>
      <div class="card">
        <b>Articles</b>
        ${o.items.map((i,k)=>{ const p = itemFor(i.pid); return `
          <div style="display:flex;flex-direction:column;gap:8px;padding-block:8px;border-top:${k?"1px solid var(--line)":"0"}">
            <div class="row">${p?thumb(p):""}<div class="grow"><div class="${i.status==="UNAVAILABLE"?"strike":""}" style="font-weight:700">${i.qty} × ${esc(i.name)}</div><div class="small">${esc(store(i.store).name)} · coût ${money(i.cost*i.qty)}</div></div><span>${money(i.qty*i.price)}</span></div>
            ${editable?`<div class="seg">
              <button class="b" data-a="item" data-id="${o.id}" data-k="${k}" data-v="BOUGHT" aria-pressed="${i.status==="BOUGHT"}">✓ Acheté</button>
              <button class="u" data-a="item" data-id="${o.id}" data-k="${k}" data-v="UNAVAILABLE" aria-pressed="${i.status==="UNAVAILABLE"}">✗ Introuvable</button>
              ${i.status!=="PENDING"?`<button data-a="item" data-id="${o.id}" data-k="${k}" data-v="PENDING">Annuler</button>`:""}
            </div>`:""}
          </div>`; }).join("")}
      </div>
      ${editable?`<div class="card">
        <b>Encaisser le montant réel</b>
        <div class="line"><span>Autorisé</span><span>${money(o.total)}</span></div>
        <div class="line total"><span>À encaisser</span><span>${money(fin)}</span></div>
        <button class="btn btn-primary" data-a="capture" data-id="${o.id}" ${pending?"disabled":""}>Encaisser ${money(fin)}</button>
        ${pending?`<span class="small">Encore ${pending} article(s) à marquer « Acheté » ou « Introuvable ».</span>`:""}
      </div>`:""}
      ${o.status==="PURCHASED"?`<div class="card">
        <b>Expédier</b>
        <div class="field"><label for="f-carrier">Transporteur</label><select id="f-carrier">${CARRIERS.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div class="field"><label for="f-track">Numéro de suivi</label><input id="f-track" placeholder="LM123456789CA" value="LM${String(100000000+o.id*7919).slice(0,9)}CA"></div>
        <button class="btn btn-primary" data-a="ship" data-id="${o.id}">Marquer expédiée</button>
      </div>`:""}
      ${o.status==="SHIPPED"?`<div class="card"><span>${esc(o.carrier)} · <b>${esc(o.tracking)}</b></span><button class="btn btn-ghost" data-a="deliver" data-id="${o.id}">Marquer livrée</button></div>`:""}
      ${editable?`<button class="btn btn-bad" data-a="cancel" data-id="${o.id}">${S.params.confirmCancel?"Confirmer : annuler et libérer la carte":"Annuler la commande"}</button>`:""}
      <div class="card">
        <b>Client</b>
        <span>${esc(o.customer.name)}<br><span class="small">${esc(o.customer.email)}${o.customer.phone?" · "+esc(o.customer.phone):""}</span></span>
        <span>${esc(o.customer.address)}<br>${esc(o.customer.city)}, ${esc(PROVINCES[o.customer.province])} ${esc(o.customer.postal)}</span>
      </div>
      <div class="card">
        <b>Montants</b>
        <div class="line"><span>Sous-total commandé</span><span>${money(o.subtotal)}</span></div>
        <div class="line"><span>Livraison facturée</span><span>${money(o.shipping)}</span></div>
        <div class="line"><span>Encaissé</span><span>${o.final==null?"—":money(o.final)}</span></div>
        <div class="line"><span>Coût des produits achetés</span><span>${money(cost)}</span></div>
        ${o.final!=null?`<div class="line total"><span>Marge avant envoi</span><span style="color:var(--ok)">${money(o.final-cost)}</span></div>`:""}
      </div>
      <div class="card"><b>Historique</b>${o.events.map(e=>`<div><div>${esc(e.msg)}</div><div class="small">${new Date(e.at).toLocaleString("fr-CA",{dateStyle:"short",timeStyle:"short"})}</div></div>`).join("")}</div>`;
  },
  "a-list"(){
    const open = S.orders.filter(o=>["NEW","SHOPPING"].includes(o.status));
    const groups = {};
    open.forEach(o=>o.items.forEach((i,k)=>{
      if(i.status!=="PENDING") return;
      const g = (groups[i.store] ??= {}); const x = (g[i.pid] ??= {pid:i.pid,name:i.name,qty:0,cost:0,refs:[],orders:new Set()});
      x.qty+=i.qty; x.cost+=i.cost*i.qty; x.refs.push(o.id+":"+k); x.orders.add(o.id);
    }));
    const ready = open.filter(o=>o.items.every(i=>i.status!=="PENDING"));
    const stores = Object.keys(groups);
    return `
      <div><h1 style="font-size:26px">Liste d'achat</h1><span class="small">${open.length} commande(s) en attente. Quantités additionnées, regroupées par boutique.</span></div>
      ${ready.length?`<div class="note note-ok"><b>Prêtes à encaisser :</b> ${ready.map(o=>`<button class="link" style="color:inherit;text-decoration:underline;margin-right:8px" data-a="aorder" data-id="${o.id}">${num(o.id)}</button>`).join("")}</div>`:""}
      ${stores.length?stores.map(sid=>{ const st=store(sid), items=Object.values(groups[sid]); const budget=items.reduce((s,x)=>s+x.cost,0);
        return `<section>
          <div class="store-h"><h3>${esc(st.name)}</h3><p>${esc(st.address)} · ${esc(st.hours)}</p><p>Budget estimé : ${money(budget)}</p></div>
          <div class="store-body">${items.map(x=>`
            <div class="shop-item">
              <span class="qbig">${x.qty}</span>
              ${thumb(itemFor(x.pid))}
              <div class="grow"><div style="font-weight:700">${esc(x.name)}</div><div class="small">${[...x.orders].map(num).join(", ")}</div></div>
              <button class="sq sq-ok" data-a="grp" data-v="BOUGHT" data-refs="${x.refs.join(",")}" aria-label="Acheté">✓</button>
              <button class="sq sq-bad" data-a="grp" data-v="UNAVAILABLE" data-refs="${x.refs.join(",")}" aria-label="Introuvable">✗</button>
            </div>`).join("")}</div>
        </section>`;}).join(""):`<div class="empty"><span class="big">🎉</span>Rien à acheter pour le moment.</div>`}`;
  },
  "a-products"({q=""}){
    const ql = q.trim().toLowerCase();
    const list = allProducts().filter(p=>!ql||(p.name+" "+aliasesOf(p)+" "+cat(p.cat).name+" "+store(p.store).name).toLowerCase().includes(ql));
    return `<div class="line"><h1 style="font-size:26px">Produits</h1><span style="display:flex;gap:14px"><button class="link" data-a="go" data-v="a-cats">Catégories</button><button class="link" data-a="go" data-v="a-stores">Boutiques</button></span></div>
      <button class="btn btn-primary" data-a="editprod">+ Nouveau produit</button>
      <label class="search">${ICONS.search}<input id="aq" type="search" placeholder="Rechercher par nom, catégorie, boutique…" value="${esc(q)}" aria-label="Rechercher un produit"></label>
      <span class="small" style="margin-top:-12px">${list.length} produit(s)${ql?` pour « ${esc(q)} »`:""}. Touchez un produit pour le modifier.</span>
      ${list.length?"":`<div class="empty"><span class="big">🔍</span>Aucun produit trouvé.<button class="btn btn-primary" style="width:auto" data-a="editprod" data-q="${esc(q)}">Créer « ${esc(q)} »</button></div>`}
      ${list.length?`<div class="card">${list.map((p,k)=>`
        <div style="display:flex;flex-direction:column;gap:8px;padding-block:8px;border-top:${k?"1px solid var(--line)":"0"};${p.active?"":"opacity:.55"}">
          <button class="row" data-a="editprod" data-id="${p.id}" style="border:0;background:none;padding:0;text-align:left;width:100%">${thumb(p)}
            <div class="grow"><div style="font-weight:700;font-size:14px">${esc(p.name)}${p.featured?` <span style="color:var(--mango)">★</span>`:""}</div>
              <div class="small">${money(p.price)} · coût ${money(p.cost)} · marge ${Math.round((p.price-p.cost)/p.price*100)} %</div>
              <div class="small">${esc(cat(p.cat).name)} · ${esc(store(p.store).name)}</div></div><span aria-hidden="true" style="color:var(--muted)">›</span></button>
          <div class="seg">
            <label class="photo-btn">${PHOTOS[p.id]?"Changer la photo":"Ajouter une photo"}<input type="file" accept="image/*" data-photo="${p.id}"></label>
            ${PHOTOS[p.id]?`<button data-a="rmphoto" data-id="${p.id}">Revenir au 3D</button>`:""}
            <button class="toggle ${p.active?"on":"off"}" data-a="toggle" data-id="${p.id}">${p.active?"Visible":"Masqué"}</button>
          </div>
        </div>`).join("")}</div>`:""}`;
  },
  "a-product"({id,draft}){
    const p = id ? prod(id) : null;
    const d = draft || (p ? {name:p.name,price:(p.price/100).toFixed(2),cost:(p.cost/100).toFixed(2),cat:p.cat,store:p.store,origin:p.origin,desc:p.desc||"",aliases:aliasesOf(p),featured:p.featured,shape:p.v.shape,color:colorOf(p.v)}
      : {name:S.params.prefill||"",price:"",cost:"",cat:CATS[0].id,store:STORES[0].id,origin:"",desc:"",featured:false,shape:"sack",color:SWATCHES[0]});
    const custom = !p || (S.custom||[]).some(x=>x.id===p.id);
    const preview = {id:"preview",name:d.name||"Nouveau produit",short:shortName(d.name||"Nouveau"),origin:d.origin||"",cat:d.cat,v:visualFor(d.shape,d.color)};
    return `
      <div><h1 style="font-size:26px">${p?"Modifier le produit":"Nouveau produit"}</h1><span class="small">Il apparaît tout de suite dans la boutique client.</span></div>

      ${m?`<div class="note ${m.ok?"note-ok":"note-warn"}">${esc(m.text)}</div>`:""}
      <form id="catNew" class="card" novalidate>
        <b>+ Nouvelle catégorie</b>
        <div class="row" style="align-items:flex-end">
          <div class="field" style="width:70px"><label for="cn-emo">Icône</label><input id="cn-emo" name="emoji" value="${esc(S.params.emo||"🛍️")}" style="text-align:center;font-size:20px"></div>

        </div>
